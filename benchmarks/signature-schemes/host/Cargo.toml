[package]
name = "scheme-bench-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
sp1-sdk = { version = "6.4.0", default-features = false, features = ["blocking", "profiling"] }
ml-dsa = { version = "0.1.1", features = ["rand_core"] }
slh-dsa = "0.2.0-rc.5"
falcon-det1024 = { path = "../../../crates/falcon-det1024", features = ["sign"] }
signature = "3.0.0-rc.4"
ed25519-dalek = { version = "2.2", features = ["rand_core"] }
rand_core = "0.10"

[build-dependencies]
sp1-build = "6.4.0"
