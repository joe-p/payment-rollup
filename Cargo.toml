[workspace]
resolver = "3"
members = [
    "crates/*",
]
# `benchmarks/signature-schemes` is a workspace of its own, and has to stay one. It depends on
# post-quantum crates this protocol does not use, and it carries `[patch]` entries of its own --
# both of which would reach the guest if it were a member here. See its README for what it measures
# and `schemes.md` for what it found.
exclude = [
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = []
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sha2 = "0.10.8"
serde_json = "1.0"
# 2.x, not 3.x, and the reason is the same one that pins sha2: SP1 accelerates Ed25519 through its
# patched `curve25519-dalek` 4.x, which is what this depends on. ed25519-dalek 3.x moved to
# curve25519-dalek 5.x and sha2 0.11, so it would lose the curve precompile and pull a second,
# unpatched SHA-256 into the guest alongside the one this workspace already accelerates. See the
# note beside it in `crates/payment-rollup/Cargo.toml` for the patch stanza itself.
ed25519-dalek = "2.2"
cc = "1.2"

# The precompiles, claimed. `[patch]` is only read from the workspace root, so these live here rather
# than beside the dependencies they redirect. Both versions have to match what the tree already
# resolves to or the patch is silently ignored, and both tags track the SP1 version in use -- 6.2.0
# is the newest the patch repos publish, and sp1-zkvm/sp1-sdk here are 6.4.0.
#
# Nothing host-side changes either way: the syscalls sit behind `cfg(target_os = "zkvm")`, so every
# build but the guest's gets the upstream implementation.
[patch.crates-io]
# `ed25519-dalek` names no precompile itself, it just does its curve arithmetic in
# `curve25519-dalek`, and this swaps that for the version whose field ops are SP1 syscalls.
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.2.0" }
# 0.10.9, not the 0.10.8 the requirement above asks for: caret means the tree resolves to 0.10.9, and
# the patch has to match the resolved version. Only the guest's `sha2` is redirected -- the 0.11 that
# `sp1-sdk` drags in through `aws-sigv4` is host-side and out of reach of a `^0.10` patch anyway.
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
